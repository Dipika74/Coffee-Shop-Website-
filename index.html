<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffe Shop Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAVBAR -->
    <header>
        <div class="navbar">
            <a href="#" class="nav-logo">
                <h2 class="logo-text">
                    <i class="fa-solid fa-mug-saucer"></i>
                    CafeMellow
                </h2>

            </a>
            <ul class="nav-menu">
                <button id="menu-close-button" class="fas fa-times"></button>
                <li class="nav-item">
                    <a href="#" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Menu</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Gallery</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Testimonials</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">Contact</a>
                </li>
                
            </ul>
            <button id="menu-open-button" class="fas fa-bars"></button>
        </div>
    </header>

    <!-- HERO SECTION -->

    <main>
        <section class="hero-section">
            <div class="section-content">
                <div class="hero-details">
                    <h2 class="title">Coffee Comfort</h2>
                    <h3 class="subtitle">Freshly brewed coffe, cozy vibes and sweet moments made for you</h3>
                    <p class="description">Sip Slowly. Stay Awhile. Make It Your Moment</p>

                    <div class="buttons">
                        <a href="#" class="order-now">Order Now</a>
                        <a href="#" class="contact-us">Contact Us</a>
                    </div>
                </div>
                <div class="hero-image-wrapper">
                    <img src="coffee-hero-section.png" alt="hero" class="hero-image">
                </div>
            </div>
        </section>
    </main>
 
</body>
</html>
